name: Blog cadence

# Publishes the next due draft from content/ to this blog through the Galascribe API, one post
# per run (see .github/blog-calendar.json and the README, "How this blog publishes"). It never
# runs on a push. The API makes the commit; this job only needs to read the repository.
on:
  schedule:
    # Sunday 18:05 and Friday 04:05 America/Los_Angeles, as fixed UTC crons. The script compares
    # calendar DATES in America/Los_Angeles, so in both seasons a run lands on its slot's own
    # date: Monday 01:05 UTC is Sunday 18:05 PDT / 17:05 PST, Friday 11:05 UTC is 04:05 PDT /
    # 03:05 PST. A slot's date is a floor, so a run that GitHub starts late (or drops) only
    # moves the post to the next run.
    - cron: "5 1 * * 1"
    - cron: "5 11 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Report the due post and what would be sent, and publish nothing (the content listing
          is read; nothing is written)
        type: boolean
        default: true
      now:
        description: Pretend today is this date, YYYY-MM-DD (only with dry run)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: blog-cadence
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Test the script
        run: node --test .github/scripts/blog-cadence.test.mjs

      - name: Run the cadence
        env:
          GALA_BLOG_API_KEY: ${{ secrets.GALA_BLOG_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_NOW: ${{ inputs.now }}
        run: |
          set -euo pipefail
          args=()
          if [ "$EVENT_NAME" = "schedule" ] || [ "$INPUT_DRY_RUN" = "false" ]; then
            args+=(--live)
          else
            args+=(--dry-run)
          fi
          if [ -n "$INPUT_NOW" ]; then
            args+=(--now "$INPUT_NOW")
          fi
          node .github/scripts/blog-cadence.mjs "${args[@]}"
